<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratório 5</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <ol>
        <li><span onmouseover="passar(this)">Passa por aqui!</span></li>
        <li>
          <span id="pinta">Dá-me cor!</span>
          <button type="button" class="color" data-color="orange">
            Orange
          </button>
          <button type="button" class="color" data-color="purple">
            Purple
          </button>
          <button type="button" class="color" data-color="hotpink">Pink</button>
        </li>
        <li>
          Experimenta escrever...
          <input id="caixa" type="text" oninput="escrever()" />
        </li>
        <li>
          Escolha uma cor em inglês:
          <select onchange="mudarFundo(this)">
            <option value="lavender">lavender</option>
            <option value="yellow">yellow</option>
            <option value="lightgreen">lightgreen</option>
            <option value="lightblue">lightblue</option>
            <option value="pink">pink</option>
          </select>
        </li>
        <li>
          <button type="button" onclick="contar()">Conta!</button>
          <span id="numero">0</span>
        </li>
        <li>
          <select onchange="mudarDirecao(this)">
            <option value="row">row</option>
            <option value="row-reverse">row-reverse</option>
            <option value="column">line</option>
            <option value="column-reverse">line-reverse</option>
          </select>
          <div id="container">
            <div class="bola"></div>
            <div class="bola"></div>
            <div class="bola"></div>
            <div class="bola"></div>
          </div>
        </li>
        <li>
          <form>
            <input id="nome" type="text" placeholder="insira o seu nome" />
            <input id="idade" type="number" placeholder="insira a sua idade" />
            <button type="submit">Enviar</button>
          </form>
          <p id="mensagem"></p>
        </li>
        <li>
          <button type="button" id="mais">incrementar</button>
          <button type="button" id="menos">decrementar</button>
          <button type="button" id="zero">reset</button>
          <span id="valor">0</span>
        </li>
        <li>Temporizador: <span id="tempo">0</span></li>
      </ol>
    </main>
    <script src="scripts/main.js"></script>
  </body>
</html>
